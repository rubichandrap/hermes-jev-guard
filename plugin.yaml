name: hermes-jev-guard
version: 0.3.0
description: Jev (TypeSafe System One) plans each turn, gates tool risk, and human-gates refactors
author: Rubi Chandraputra
license: MIT
homepage: https://github.com/rubichandrap/hermes-jev-guard
# manifest_version omitted: the current Hermes installer caps at 1; the loader parses config_schema either way
tags: [guardrail, routing, typesafe, jev]
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - pre_verify
requires_env:
  - name: TYPESAFE_API_KEY
    description: TypeSafe API key for Jev (System One)
    url: https://typesafe.ai
    secret: true
config_schema:
  timeout: {type: float, default: 8, description: HTTP timeout in seconds for Jev calls}
  approve_at: {type: float, default: 0.7, description: Risk probability that escalates a tool call to human approval}
  block_at: {type: float, default: 0.97, description: Risk probability that blocks a tool call}
  verify_at: {type: float, default: 0.7, description: Done-check probability that nudges the agent to continue}
  max_state_chars: {type: int, default: 12000, description: State sent to Jev is clipped to this many characters}
  economy_model: {type: str, default: "", description: Model id to use when Jev pitches the economy tier; empty disables the swap}
  standard_model: {type: str, default: "", description: Model id to use when Jev pitches the standard tier; empty disables the swap}
  frontier_model: {type: str, default: "", description: Model id to use when Jev pitches the frontier tier; empty disables the swap}
  risk_tools: {type: str, default: "", description: Pipe-separated tools that get a Jev risk score; empty scores every tool}
  force_lane: {type: str, default: "", description: Probability at which a delegating lane blocks the first direct tool call once; empty keeps lanes advisory}
